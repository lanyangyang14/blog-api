[project]
name = "blog-api"
version = "0.1.0"
description = "A blog API built with FastAPI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
     "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "python-jose[cryptography]>=3.3",
    "pwdlib[argon2]>=0.2",
    "python-multipart>=0.0.12",
    "markdown-it-py>=3.0",
    "httpx>=0.27",
    "redis>=5.0",
    "aiosqlite>=0.20",
    "celery[redis]>=5.4",       # Celery + Redis broker
    "jinja2>=3.1",              # 邮件模板（可选）
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "types-python-jose",
     "redis>=5.0",
     "types-redis",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# ============ ruff ============
[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".venv", "build", "dist", "*.egg-info", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["blog_api"]

# ============ mypy ============
[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "celery",
    "celery.*",
    "kombu",
    "kombu.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "blog_api.tasks.*"
disable_error_code = ["misc", "type-arg", "no-untyped-def"]


[[tool.mypy.overrides]]
module = "blog_api.core.celery_app"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "blog_api.core.celery_beat_schedule"
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = "blog_api.exception_handlers"
disable_error_code = ["misc"]
# ============ pytest ============
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
markers = [
    "unit: 单元测试",
    "integration: 集成测试",
    "slow: 慢测试",
]

# ============ coverage ============
[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
#=====sqlalchemy============
[tool.sqlalchemy]
